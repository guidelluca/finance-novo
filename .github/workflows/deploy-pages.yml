# Publica o app no GitHub Pages a cada push na main (igual ao Tocah).
# Configure em Settings → Secrets and variables → Actions:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (opcionais: o padrão é o projeto "finance")
#   VITE_GEMINI_API_KEY, VITE_GROQ_API_KEY     (opcionais — só para "ler print com IA")
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Projeto Supabase "finance". A chave publishable é pública por design (vai no JS do app);
          # a proteção dos dados é o RLS. Um secret com o mesmo nome, se existir, tem prioridade.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://dmabtnbdxspvoingwgdq.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_3NBXCtdbAwViX2Y2s7hZug_EZULxj3l' }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
        run: npm run build

      # SPA: rotas como /finance-novo/mes abrem o app em vez de 404
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
